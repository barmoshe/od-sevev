# motion-spec (UI + screen + reward FX): "עוד סבב"
# Owner: Animator. Consumers: Game Developer (Godot tweens), Audio Director (cue alignment: event-markers.md),
# UX Designer (flow owner: first-minute.md), Technical Artist (fx-data ids named here), 2D Artist (pending art named here).
# Template: gamestudio ui-and-screen-motion/tools/motion-spec-yaml-template.md (one YAML document per motion).
# Global rules (framerate, units, snap, easing → Godot names, reduced motion): motion/README.md. Not restated here.
#
# Field extensions (as in the fork's legacy spec; flagged for adoption in contracts/artifacts.md):
#   snap          positions are rounded to this grid AFTER easing: "4" = the 4-px logical UI grid, "S" / "Sp" / "aap" = one
#                 art px of the moved sprite (README §2)
#   quantize      a driver value mapped to integer render scales (pixel art never draws at a fractional scale > 180 ms)
#   frames_at_60  the frame-by-frame result at 60 Hz
#   reduced_motion keep | reduce | disable, with reduced_motion_alternative when not keep
#   anchor        a timeline anchored to an AUDIO marker rather than to f0 (the fanfare): the AD publishes the marker
# Numbers written <like.this> are Game Designer / UX values read by name from content.json / ui-strings, not Animator-owned.
---
motion-id: _globals
type: rules
runtime: godot-tween
rules:
  fps_reference: 60
  logical_canvas: "720 wide (stretch expand); 1 CSS px = 1.846 logical px (UX §3.1). UX CSS numbers are restated on the 4-px grid below."
  press_on_pointerdown: "press visuals are applied synchronously in the input handler (f0), never on the first tween tick"
  commit_on_release: "every button commits on pointer-up inside bounds (UX); drag > 10 px cancels (UX §3.3)"
  one_modal_at_a_time: "motion never overlaps two modal enters; the UX modal queue (first-minute §1.2 rule 3) orders them"
  no_auto_open_in_tap_burst: "no modal / court card / toast ENTERS while the last registered tap is < 1000 ms old (UX rule 3); it waits, then plays in full"
  flash_ceiling: "no luminance flash above 3 Hz anywhere; every 'flash' below is a one-shot of ≤ 2 frames, ≤ 1 per second per element"
  reduced_motion_policy: |
    UX §7.3 is binding: ticker paged (no crawl); screen shake 0; coin bursts → 3 coins, no arcs; the rabbit appears
    instead of hopping; parallax off; transitions ≤ 200 ms cross-fades; bubbles → static icons; the Suitcase still moves
    (×0.8 speed, no bob); no flash > 3 Hz; the court-day red is a steady tint.
motion-constants:          # Animator-owned (not feel tunables). Mirror to game/scripts/core/tune.gd MC (developer).
  # the Magician (state-graph-magician.md)
  magicianStartleKnockMs: 180
  magicianTakeEndMs: 330
  magicianZipOutMs: 200
  magicianZipInMs: 220
  magicianZipQuickMs: 150
  magicianEmptyBeatMs: 150
  hatSummonDelayMs: 250
  hatZipInMs: 300
  hatZipOutMs: 150
  hatZipOutQuickMs: 120
  hatBobPeriodMs: 1600
  hatBobAp: 2
  hatTapRiseMs: 80
  hatTapFallMs: 120
  hatTapHopAp: 4
  tapFrame3MinShowMs: 33
  critSpillMinGapMs: 67
  postCritTapWindowMs: 150
  coinBurstBase: 3
  coinBurstCap: 6
  critCoinBase: 10
  critCoinCap: 12
  hatCoinBase: 2
  hatCoinCap: 4
  trickLeadMs: 333            # crit f1 → f5 at 12 fps; the sting lands on rollEnd
  trembleHz: 8
  coinPeekRiseAp: 5
  coinPeekRiseMs: 200
  coinPeekHoldMs: 150
  idleInviteAfterMs: 20000
  idleInviteEveryMs: 10000
  saraOffendDelayMs: 150
  saraOffendCooldownMs: 8000
  partnerReactQueueMaxAgeMs: 1500
  # chat
  chatBubbleInMs: 180
  chatBubbleInOffsetPx: 16
  chatScrollMs: 180
  chatToastInMs: 240
  chatToastHoldMs: 3500
  chatToastOutMs: 180
  stampSlamMs: 90
  seatPipMax: 6
  seatPipStaggerMs: 50
  seatPipFlightMs: 450
  ultimatumNudgeFromSec: 10
  ultimatumUrgentFromSec: 3
  leftGroupLineStartMs: 140      # the system line lands at 320 = ultimatumZero's ping onset (AD cues.json)
  leftGroupDoorMs: 510           # ultimatumZero's door click
  seatUnfillStepMs: 40
  # ticker
  tickerStepHz: 20            # one font-texel step every 3 render frames → speed = 20 × fontScale logical px/s
  # court
  courtCardInMs: 280
  courtTintAlpha: 0.18
  courtTintMs: 400
  courtCardOutMs: 180
  excuseReadMsPerChar: 60
  excuseReadMinMs: 2000
  # rewards
  curtainCoverMs: 300
  curtainHoldMinMs: 600
  curtainUncoverMs: 300
  receiptFeedBursts: 10
  receiptFeedBurstMs: 70
  coinFlyMs: 380
  coinFlyStaggerMs: 35
  coinFlyHangMs: 250
  coinFlyMax: 10
  suitcaseBobAp: 4
  suitcaseBobPeriodMs: 1200
  suitcaseTrailEveryMs: 120
---
motion-id: _carryover
type: rules
source: motion/legacy/motion-spec.monkey-bananas.yaml + motion/legacy/ui-juice.monkey-bananas.yaml
rule: "Only the ids below bind. KEEP = binding as written there, with the note applied. ADAPT = re-specified in this file. RETIRE = gone."
table:
  button-press:        { verdict: KEEP, note: "every ui_button; plus J1 variant A" }
  buy-row-press:       { verdict: KEEP, note: "applies to the source cards (T1) and spin cards (T2): the whole 366×64 CSS card is the target (UX §3.1)" }
  purchase-row-flash:  { verdict: KEEP, note: "flash + owned pop + icon hop on a source/spin buy; the critter plop is RETIRED (the stage shows the source walking on, a 2D/UX beat outside this file)" }
  upgrade-buy-pop:     { verdict: KEEP, note: "for spins if T2 renders as a shelf; if T2 is cards, purchase-row-flash covers it" }
  cant-afford-shake:   { verdict: KEEP }
  afford-glint:        { verdict: ADAPT, note: "the glint band sweeps RIGHT → LEFT (RTL reading start, matching the pill fill direction); all else as legacy" }
  producer-row-reveal: { verdict: ADAPT, note: "'מקור עלום' reveal fires when shekels ≥ 50% of the price (UX P2), not on unlock; unmask + hop as legacy" }
  shop-drawer:         { verdict: RETIRE, note: "replaced by tall-tab below" }
  shop-tab-switch:     { verdict: KEEP, note: "4 tabs; incoming list enters from the side of the tapped tab (mirrored for RTL); + J7" }
  modal-enter:         { verdict: KEEP, note: "O1 return, O3 election card, O3b Dubi flash, O6 headline, O10, O11, O12; + J6" }
  modal-exit:          { verdict: KEEP }
  evolve-button-reveal: { verdict: RETIRE, note: "→ election-cta" }
  evolve-button-ready: { verdict: ADAPT, note: "→ election-cta (unlock beat + 3 s ready pulse reused)" }
  hud-bank-counter:    { verdict: ADAPT, note: "passive accrual redraws at ≤ 10 Hz (UX §3.2 #1); any player action (tap, buy, pay, catch, collect) snaps on its own f0. Anchor fixed; LRI…PDI isolation (dev)" }
  hud-bank-pop:        { verdict: KEEP }
  tap-floater:         { verdict: KEEP, note: "'+1 ₪' (number first, ₪ after, in logical order; UX §3.5)" }
  crit-floater:        { verdict: KEEP, note: "the rabbit crit's '+N ₪!'; appears at the tap's f0 (never waits for the rabbit)" }
  buff-banner:         { verdict: ADAPT, note: "→ event-toast (Suitcase outcomes, spin unlock, 'נפתח לך תיק', etc.) = J6 drop-in, 2000 ms total" }
  buff-presence:       { verdict: ADAPT, note: "only for timed spins (e.g. S07 'סופר-ספרטה', 30 s): edge glow + timer bar + last-3 s 2 Hz blink as legacy" }
  headline-ticker:     { verdict: ADAPT, note: "→ headline-ticker below (RTL crawl, step cadence, paged RM)" }
  offline-count-up:    { verdict: KEEP, note: "O1 return card; plus coin-fly-to-counter on 'לאסוף'" }
  evolve-ceremony:     { verdict: RETIRE, note: "→ election-ceremony" }
  J1-ui-pill-squish:   { verdict: KEEP, note: "incl. the chat pay pill (variant A)" }
  J2-hud-stat-gain:    { verdict: KEEP, note: "shekel counter big-gain squash-pop; the bps bump applies to the rate line" }
  J3-shop-hop-cascade: { verdict: KEEP }
  J4-pill-hello:       { verdict: KEEP }
  J5-badge-pop:        { verdict: KEEP, note: "the coalition tab badge" }
  J6-bouncy-drop-in:   { verdict: KEEP, note: "modals, toasts, banners" }
  J7-tab-switch-bounce: { verdict: KEEP }
  J8-ticker-letter-hop: { verdict: RETIRE, note: "Hebrew is shaped by TextServer in a Label/RichTextLabel; per-glyph hops break word shapes and bidi runs. UX rtl-map §5.2 left it to the Animator: no whole-line hop either (a 360-px line jumping reads as a glitch at crawl speed). The milestone uses the flash only" }
---
# =====================================================================================================================
# TITLE → PLAY (UX asks: the logo exit on tap 1)
# =====================================================================================================================
motion-id: title-to-play
type: screen-transition
applies_to: "N2 title state → play state, on the FIRST registered Magician tap ever (and after a progress reset)"
runtime: godot-tween
total_duration_ms: 450
phases:
  counter_pop_in: { start: 0, action: "shekel counter appears at top centre showing the tap's +1 at f0; integer scale ×(s+1) for f0-f4 then ×s (cut at 80 ms); opacity 0 → 1 over 50 ms Linear", quantize: integer }
  dubi_squawk:    { start: "the dubiSquawk cue (AD cue-spec §2.6: after the first-tap motif ends, 4138 ms in D; UX first-minute wants it at f0; seam flagged)", ref: dubi-squawk-bubble, text: "dubi.firsttap 'אין כלום! אין כלום!'" }
  logo_exit:
    start: 0
    duration_ms: 350
    ease: 'Back.In'             # the built-in pull-back (≈ 10% dip) is the anticipation before it flies
    transform:
      - { property: logo.translateY, from: 0, to: "-(logo.bottom + 16)" }
      - { property: logo.opacity, from: 1, to: 0, start_ms: 250, duration_ms: 100, ease: 'Linear' }
    snap: 4
  round_line_out: { start: 0, duration_ms: 150, ease: 'Quad.In', transform: [ { property: opacity, from: 1, to: 0 } ] }
  ticker_dock:
    start: 150
    duration_ms: 250
    ease: 'Quad.Out'
    transform: [ { property: ticker.translateY, from: "+80 (44 CSS)", to: 0 } ]
    snap: 4
  chip_dock:
    start: 150
    duration_ms: 300
    ease: 'Quad.InOut'          # a traversal between two resting places
    transform: [ { property: countdownChip.position, from: "title slot", to: "ticker slot (left end)" } ]
    snap: 4
  first_headline: { start: 450, action: "ticker H1 (deck T25) starts crawling" }
frames_at_60: "f0 counter + squawk + logo starts | f9 ticker and chip start | f24 ticker docked | f27 chip docked, H1 crawls"
input: "taps keep registering throughout (the verb is never blocked)"
audio:
  - { on: "f0", cue_id: "motif stinger (AD: the first tap plays it INSTEAD of tap)", bus: SFX-Critical }
  - { on: "motif end", cue_id: "dubiSquawk down + dubiBlip babble (canned contour 5-5-1, doubled)", bus: Voice }
reduced_motion: reduce
reduced_motion_alternative: "logo + round line cross-fade out 200 ms; ticker and chip cross-fade in at their final slots 200 ms; counter appears at ×s (no pop)"
---
motion-id: dubi-squawk-bubble
type: notification
applies_to: "Dubi's cream speech bubble (first tap, P1 fallback, E1 fallback, Suitcase miss follow-up, aide drop)"
runtime: godot-tween
anchor: "the frame the engine plays dubiSquawk (state-graph-dubi.md §3); the bubble, the squawk strip and the voice start together"
enter: { duration_ms: 150, ease: 'Back.Out', transform: [ { property: translateY, from: 8, to: 0 }, { property: opacity, from: 0, to: 1 } ], snap: 4 }
hold_ms: "babble length (≤ 1600, AD cap) + 400"
exit: { duration_ms: 150, ease: 'Quad.In', transform: [ { property: opacity, from: 1, to: 0 } ] }
beak: "Dubi art pending (2D). When it lands: beak-open frame for 55 ms on each babble blip onset (AD: 'beak-flap frame = one blip')"
reduced_motion: reduce
reduced_motion_alternative: "fade in/out 120 ms, no translate"
---
motion-id: coin-burst
type: fx
applies_to: "coins out of the Magician's hat (tap / crit / celebration), out of the prop hat (court day), and the Suitcase"
runtime: "godot-tween per coin (pooled Sprite2D, shared atlas) — or TA fx-data emitter with the same numbers (TA's call)"
spawn: "hatMouth.<strip>[frame] of the frame on screen when the marker fires (state-graph-magician.md), in world space"
sprite: "prop coin0..coin3 flipbook at 16 fps (a spin), random start frame; bills (prop_bill) do not spin: x flutter ±1 ap sine 4 Hz"
count: "per state graph: tap min(3 + (batch - 1), 6); crit min(10 + (batch - 1), 12) + 2 bills; hat min(2 + (batch - 1), 4); celebration 16 + 6 bills"
physics:             # in ap of the emitting sprite (×S logical px)
  angle_deg: "U(-165, -95)  (0 = screen right, -90 = up: an up-and-left fan away from his head; the hat is on his screen-left)"
  speed_ap_s: { tap: "U(70, 110)", crit: "U(90, 140)", celebration: "U(90, 150)" }
  gravity_ap_s2: 320
  life_ms: { tap: 450, crit: 600, celebration: 700 }
  fade: "alpha 1 until life − 150 ms, then → 0 Linear"
snap: S
depth: "in front of the Magician, behind the HUD"
budget: "max 36 coins alive (16 taps/s worst case ≈ 15 alive + a crit 14); TA folds this into fx-data gameplayMaxAliveTotal"
audio: []            # the tap/crit cues are on the input f0 and the rabbit marker (event-markers.md); coins themselves are silent
reduced_motion: reduce
reduced_motion_alternative: "3 coins at x offsets −4, 0, +4 ap rise straight up 6 ap over 250 ms Quad.Out, fade over the last 100 ms; no spin, no arcs (UX §7.3)"
---
# =====================================================================================================================
# COALITION CHAT "קואליציה 61" (UX first-minute §4)
# =====================================================================================================================
motion-id: tall-tab
type: modal
applies_to: "T3 קואליציה and T4 תיקים (tall tabs; HUD rows A+B stay visible above)"
runtime: godot-tween
open:  { duration_ms: 280, ease: 'Cubic.Out', transform: [ { property: panel.translateY, from: "+panelH", to: 0 } ], snap: 4 }
close: { duration_ms: 200, ease: 'Quad.In',   transform: [ { property: panel.translateY, from: 0, to: "+panelH" } ], snap: 4 }
swipe_down: "the panel follows the finger 1:1 (snap 4); release past 30% of panelH → close from the current y (duration scaled by remaining distance, min 80 ms); otherwise back to 0 in 150 ms Quad.Out"
input: "thread accepts taps from 140 ms after open start; the stage is covered from f0 (Suitcase spawn guard: UX rule 4)"
audio:
  - { on: open, cue_id: "panelOpen (AD)", bus: ui }
  - { on: close, cue_id: "panelClose (AD)", bus: ui }
reduced_motion: reduce
reduced_motion_alternative: "opacity fade 150 ms open / 120 ms close, no slide"
---
motion-id: chat-toast
type: notification
applies_to: "chat-preview toast when a partner posts and the chat is closed (C1 and every later ping); docks at y 163-223 CSS"
runtime: godot-tween
enter: { duration_ms: 240, ease: 'Back.Out', transform: [ { property: translateY, from: -24, to: 0 }, { property: opacity, from: 0, to: 1, duration_ms: 120 } ], snap: 4, note: "= J6 drop-in" }
avatar: "partner-avatar arrival echo at enter end (240 ms)"
hold_ms: 3500
exit: { duration_ms: 180, ease: 'Quad.In', transform: [ { property: translateY, from: 0, to: -12 }, { property: opacity, from: 1, to: 0 } ], snap: 4 }
tap: "opens the chat (tall-tab open); the toast exits in 120 ms"
replace: "a new ping while shown: content cuts to the new message + 1-ap bump (translateY −4 → 0, 100 ms Quad.Out); hold restarts"
badge: "tab badge: J5 badge-pop on each increment; C1 F1 fallback = one J5 bounce + bold label (UX)"
audio:
  - { on: enter.start, cue_id: "chatPing (sonic brief #4; per-partner interval; coalesced ≤ 1 per 700 ms; never inside a Dubi squawk: queue ≥ 300 ms)", bus: ui }
reduced_motion: reduce
reduced_motion_alternative: "fade in 150 / out 150, no drop, no bump"
---
motion-id: chat-typing
type: microinteraction
applies_to: "header status line '{name} מקליד/ה…', shown 1200 ms (UX) before every partner bubble — the telegraph"
runtime: godot-tween
status_line: "cut to the typing text at f0; cut back to '{n} משתתפים' / '{k} איומי פרישה פתוחים' when the bubble lands"
ellipsis: "0 → 1 → 2 → 3 dots, Stepped, 300 ms per step, looping (3.3 Hz text change, not a luminance flash)"
leaked_opposition_chat: "Gantz's header 'בני גנץ מקליד…' runs this loop forever (copy deck E.2): the visual twin of his 99% bar"
reduced_motion: reduce
reduced_motion_alternative: "static '…'"
---
motion-id: chat-message-arrival
type: notification
applies_to: "every bubble and system line entering the thread"
runtime: godot-tween
f0: "typing telegraph ends (partners) / commit (player replies, no typing) / event (system lines)"
scroll: "if the thread is at the bottom: content translateY −bubbleH over 180 ms Quad.Out, snap 4. If the player has scrolled up: no scroll; the unread divider / 'new messages' pill does a J5 bump"
bubble:
  duration_ms: 180
  ease: 'Quad.Out'
  transform:
    - { property: translateX, from: "+16 for incoming (from the right edge side), −16 for the player's replies (left), 0 for centred system lines", to: 0 }
    - { property: translateY, from: "+8 (system lines only)", to: 0 }
    - { property: opacity, from: 0, to: 1 }
  snap: 4
avatar_echo: "starts at 180 ms (landing): arrival echo for plain messages; the partner's react echo for emphatic ones (state-graph-cast.md §1)"
ultimatum_landing: "ultimatum bubbles land heavier: at 180 ms translateY +4 → 0 over 100 ms Quad.Out (a 1-ap thud)"
audio:
  - { on: "landing (180 ms), chat open", cue_id: chatPing, bus: ui, note: "when the chat is closed the ping is on chat-toast instead; never both" }
reduced_motion: reduce
reduced_motion_alternative: "opacity 0 → 1 over 120 ms, no translate; scroll cuts; no avatar echo"
---
motion-id: chat-pay-pill
type: microinteraction
applies_to: "demand / ultimatum / 'להחזיר לקבוצה' pay pills (170×36 CSS visual, 182×48 hit)"
runtime: godot-tween
press: "button-press (frame cut + label +2 ap at f0) + J1 variant A squish (w +8, h −8), held while down; release rebound 67 ms"
fill_while_unaffordable: "the pill's 'חסר {n} ₪' progress fill grows RIGHT → LEFT; width tween 200 ms Linear on each change (a progress bar), snap 4"
became_affordable: "afford-glint (RTL sweep) + J4 pill-hello, same f0; label cuts to 'סגרנו · {price} ₪'"
commit_affordable: "→ chat-paid"
commit_unaffordable: "cant-afford-shake (legacy, ±4 px, 180 ms); J1 rebound skipped"
reduced_motion: reduce
reduced_motion_alternative: "press frame cut + label drop kept (affordance); no squish, no glint; fill width cuts"
---
motion-id: chat-paid
type: stinger
applies_to: "a partner paid from the thread (demand, ultimatum, or rejoin)"
runtime: godot-tween
f0: "commit (pointer-up inside the pill). Seats numeral + treasury update at f0 (truth)"
beats:
  - { t: 0,   action: "pill content cuts out; stamp-slam 'שולם' on the pill's spot (label chat.paid)" }
  - { t: 90,  action: "stamp impact (bubble jolts 1 ap); seat-pip-flight launches from the stamp centre" }
  - { t: 90,  action: "ultimatum only: chat-ultimatum-collapse starts ('ההודעה נמחקה')" }
  - { t: 300, action: "the player's auto-reply bubble lands (chat-message-arrival, left side, no typing): 'העברתי.' / 'סגור.' / 'בוצע. אין כלום.'" }
  - { t: 790, action: "last seat pip lands (6 pips); if seats ≥ 61 now → election-cta at +100" }
audio:
  - { on: "t=90 (impact)", cue_id: "OPEN: the AD cue-spec assigns no cue to paying a partner ('stamp' is scoped to Herzog's desk). Proposed: 'stamp' (the same family; the thump is at its 0 ms) or 'buy'", bus: SFX-Frequent }
reduced_motion: reduce
reduced_motion_alternative: "stamp cuts in at rest scale (no slam, no jolt); pips skipped: the bar's new segments fade in over 150 ms at t=0; auto-reply fades in at 300"
---
motion-id: seat-pip-flight
type: fx
applies_to: "seat pips from a paid bubble (or rejoin) to the seats bar in HUD Row B (UX asks). C2 seats_reveal: the first ever flight also reveals the bar"
runtime: godot-tween
count: "k = min(partner seats, 6); each pip represents seats/k"
sprite: "a 3×3 ap seat-bar segment square in the seats blue (2D palette)"
path: "quadratic Bezier: p0 = the pay pill / stamp centre; p2 = the bar's FILL HEAD (the bar fills from the RIGHT, so p2 is the left end of the filled run; UX rtl-map §3); control = (p0.x + 0.3·(p2.x − p0.x), min(p0.y, p2.y) − 160)"
per_pip: { duration_ms: 450, ease: 'Quad.In', stagger_ms: 50, snap: 4 }     # Quad.In on the path parameter: sucked into the bar
arrival: "the bar's fill extends by seats/k at each arrival (cut; whole segments where possible). NO per-pip flash (6 arrivals in 250 ms would break the 3 Hz ceiling). On the LAST arrival: bar translateY −4 → 0 over 100 ms Quad.Out + a single 2-frame white edge flash"
first_reveal: "C2: the bar itself enters (J6 drop-in) at pip launch so the pips have somewhere to land; UX: 'the seats bar appears at 34/61'"
frames_at_60: "launch f5 (t=90) | pip 1 lands f32 | pip 6 lands f47 (t=790)"
audio:
  - { on: "last arrival", cue_id: "seatsGain (AD: proposed; null acceptable)", bus: ui }
reduced_motion: reduce
reduced_motion_alternative: "no pips; new segments fade in 150 ms at the commit f0; no bump, no flash"
---
motion-id: chat-ultimatum-countdown
type: ambient
applies_to: "ultimatum bubble: hatched border + 'אולטימטום' label + timer pill '0:45' (90 s; pauses while hidden)"
runtime: godot-tween
digits: "cut once per displayed second (LTR digits, isolated)"
urgency:
  calm:   { when: "> 10 s", motion: none }
  nudge:  { when: "≤ 10 s", motion: "timer pill translateY +4 → 0 over 100 ms Quad.Out on each second tick (1 Hz)" }
  urgent:
    when: "≤ 3 s"
    motion:
      - "nudge on every half-second tick (2 Hz), in step with the AD's doubled tick rate"
      - "hatched border marches: the hatch pattern offset shifts 1 ap per tick (2 Hz)"
      - "timer text cuts to the alert palette index (steady; not flashing)"
header: "status line '{k} איומי פרישה פתוחים' while any ultimatum is open (UX)"
chat_closed: "the stage cameo (state-graph-cast.md §2b, pending UX) carries the countdown diegetically; the tab badge carries the count"
audio:
  - { on: "each displayed second", cue_id: "ultimatumTick tick/tock (sonic brief #5)", bus: sfx, note: "doubled in the last 3 s; the visual nudge fires on the SAME tick event, never on its own timer" }
reduced_motion: reduce
reduced_motion_alternative: "no nudges, no march; the alert colour at ≤ 10 s (steady) and the digits carry it"
---
motion-id: chat-ultimatum-collapse
type: microinteraction
applies_to: "a paid ultimatum bubble collapsing to 'ההודעה נמחקה' (UX)"
runtime: godot-tween
start: "chat-paid t=90 (stamp impact)"
phases:
  content_out: { duration_ms: 150, ease: 'Quad.Out', transform: [ { property: content.opacity, from: 1, to: 0 } ] }
  border:      { at: 0, action: "hatched border cuts to the plain bubble border" }
  height:      { start: 90, duration_ms: 200, ease: 'Quad.InOut', transform: [ { property: bubble.height, from: current, to: "one-line height" } ], snap: 4 }
  deleted_in:  { start: 200, duration_ms: 120, ease: 'Quad.Out', transform: [ { property: deletedLabel.opacity, from: 0, to: 1 } ] }
reduced_motion: reduce
reduced_motion_alternative: "content + border + height cut; label fades in 120 ms"
---
motion-id: chat-left-group
type: stinger
applies_to: "an ultimatum timer reaching 0: the partner leaves (UX §4.2; recoverable via 'להחזיר לקבוצה')"
runtime: godot-tween
