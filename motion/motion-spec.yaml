motion-id: headline-ticker
type: ambient
applies_to: "HUD ticker row (44 CSS tall): the crawl, the milestone pre-empt, Dubi's beak"
runtime: per-frame update
crawl:
  direction: "LEFT → RIGHT (the RTL mirror; a Hebrew line's first word, its rightmost, enters from the left edge first)"
  cadence: "one font-texel step every 3 render frames (tickerStepHz 20): x = x0 + snap(20 × fontScale × t, fontScale); time-based accumulator so 120 Hz displays step identically"
  speed: "×3 font (default) = 60 logical px/s (32.5 CSS px/s); ×4 font ('טקסט גדול') = 80 logical px/s (43.3 CSS px/s). See OBJECTION O-M2 against UX rtl-map §5.2 (v = 74 logical px/s with snap 3 = 24.7 steps/s, an uneven 2-3-2-3 frame cadence)"
  headline_every: "8-12 s (pitch §9); conditional lines jump the queue"
milestone: "legacy flash (whiteOverlay 0.8 → 0, 120 ms Quad.Out) on pre-empting lines; at most one flash per 8 s"
dubi: "beak-open frame for 55 ms on each babble blip (AD), when Dubi's art lands"
replaced_by: "election-cta at seats ≥ 61"
tap: "opens O6 headline card (modal-enter + J6)"
audio:
  - { on: "milestone pre-empt", cue_id: "milestoneHeadline / Dubi babble (AD: babble on ≤ 1 headline per 20 s)", bus: voice }
reduced_motion: reduce
reduced_motion_alternative: "PAGED (UX §7.3): one headline at a time, static, left-aligned; a 200 ms cross-fade to the next after max(4000, 60 ms × chars); a tap shows the next; pre-empts cut in with no flash"
