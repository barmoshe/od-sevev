motion-id: election-ceremony
type: screen-transition
applies_to: "O3 'לפזר את הכנסת' confirmed → the ballot-curtain ceremony → the new round; O3b Dubi flash follows"
runtime: "godot-tween + timers, one Timeline driven by the FANFARE CLOCK"
anchor: |
  The AD's election fanfare (audio/od cue-spec §2.4; manifest stingers.fanfare.files[<incoming key>][<tags>]).
  Derived from od_manifest.json, all in ms from the fanfare's start, with T0 = musicalSeconds of the 0-tag file
  (2 bars at the incoming era's tempo: D 4138, E 3636, F 3333, G 5455):
    rollEnd      = T0 / 2                       (1 bar: D 2069, E 1818, F 1667, G 2727)
    tagOnsets[i] = T0 + (i − 1) × T0 / 4        (i = 1..tags; tags = min(round − 1, 4))
    fanfareEnd   = musicalSeconds of the <tags> file (the incoming era starts at bar 1 exactly there)
  The t values below are on that clock. The AD's cue-spec starts the fanfare at the NEXT BAR LINE after confirm (the bed
  stops with a 30 ms fade), so t = 0 below is fanfareStart, which lags the confirm by 0 to 1 bar. The confirm itself
  runs the card exit and the anticipate crouch; the anticipate hold absorbs the wait (see OBJECTION O-M3 in STATUS).
curtain: "a full-screen panel in the ticker maroon (#7A1426 or the 2D Artist's pick) with a ballot-slot motif; it travels RIGHT → LEFT (the RTL 'forward') the whole way: enters from the right edge, leaves off the left"
beats:
  - { t: "confirm (≤ 0)",    beat: confirm,     action: "O3 modal-exit (160 ms); input LOCKED; the 'עוד סבב!' button fades 200 ms; Magician → anticipate (tap.f1 crouch)" }
  - { t: 0,                  beat: fanfareStart, action: "the roll begins (the next bar line after confirm)" }
  - { t: "(rollEnd−333)/2",  beat: tremble,     action: "Magician tremble ±1 ap at 8 Hz starts (with the roll's crescendo)" }
  - { t: "rollEnd − 333",    beat: trick,       action: "Magician → trick (crit.f1)" }
  - { t: "rollEnd − 83",     beat: rabbit,      action: "crit.f4: the rabbit is out (the pickup)" }
  - { t: rollEnd,            beat: IMPACT,      action: "crit.f5 sting (wink). ballotConfetti fx from hatMouth.crit[5] (TA fx-data: 24 white slips 2×3 ap, flutter, 900 ms); coin-burst celebration (16 + 6 bills); camera punch stage y +2 ap (1 frame), +1 ap (1 frame), 0; seats bar one 2-frame white flash" }
  - { t: "C = min(rollEnd + 750, fanfareEnd − 1200)", beat: cover, action: "Curtain enters from the right: translateX +W → 0, 300 ms Quad.In (it slams shut at the left edge). If C < rollEnd + 750 (fast keys E/F with 0 tags) the curtain closes over the tail of the trick (the rabbit sinking), and the body goes to bow under the cover" }
  - { t: "C + 300",          beat: reset-seam,  action: "RESET SEAM under full cover: money, sources, spins, coalition; chat cleared (partner-avatar chatCleared) + the system line; era swap (stage bg, Sara); suspicion → the round's floor; hat-prop hidden" }
  - { t: "C + 450",          beat: round-card,  action: "on the curtain, 'סבב בחירות מס׳ {n}': the changing digits roll (old digit translateY 0 → −8 ap + fade, new digit +8 ap → 0), 200 ms Quad.Out, then translateY −4 → 0 bounce 100 ms" }
  - { t: "C + 750",          beat: mood,        action: "mood line (mood.{n}) fades in 150 ms Quad.Out" }
  - { t: "each tagOnset",    beat: tag,         action: "the round number hops 1 ap (translateY −4 → 0, 100 ms Quad.Out): 'the public is thrilled', once per tag" }
  - { t: "fanfareEnd − 300",  beat: uncover,     action: "curtain leaves off the LEFT edge: translateX 0 → −W, 300 ms Quad.In; the new round's stage is revealed. The hold (C + 300 → here) is ≥ 600 ms by construction" }
  - { t: "fanfareEnd",       beat: ceremonyEnd, action: "input UNLOCKED; Magician bow → idle; the reveal completes ON the resolution downbeat (the incoming era's bar 1)" }
  - { t: "ceremonyEnd + 200", beat: flash,     action: "O3b Dubi flash opens (modal-enter + J6; UX order)" }
skip: "from C + 900 (cover complete + 600 ms) a tap on the curtain starts the uncover at once; the fanfare keeps playing and still resolves on the new loop (AD). Only reachable with tags (the 0-tag hold is exactly 600-1378 ms)"
worked_example: |
  On the fanfare clock; add w (0 ≤ w < 1 bar) for the time after the confirm.
  D, 0 tags: trick 1736 | IMPACT 2069 | cover 2819 | seam 3119 | uncover 3838 | unlock 4138 (hold 719)
  E, 0 tags: trick 1485 | IMPACT 1818 | cover 2436 | seam 2736 | uncover 3336 | unlock 3636 (hold 600)
  F, 0 tags: trick 1334 | IMPACT 1667 | cover 2133 | seam 2433 | uncover 3033 | unlock 3333 (hold 600)
  G, 0 tags: trick 2394 | IMPACT 2727 | cover 3477 | seam 3777 | uncover 5155 | unlock 5455 (hold 1378)
  D, 4 tags: … cover 2819 | uncover 7976 | unlock 8276 (hold 4857; skippable from 3719)
dog_note: |
  Not a reward stinger (≤ 800 ms): it is a screen transition that has to hide a full-board reset. The peak (IMPACT) is
  the pay-off of the AD's one-bar roll, not dead time, because the Magician's crouch and tremble ride it. The playable
  return is fanfareEnd (0 tags: 3.3-5.5 s after fanfareStart). With tags it is skippable from C + 900, so a longer wait
  happens only when the player chooses to watch the round card.
input_lock: "t = 0 → ceremonyEnd (or the skip); the curtain swallows taps (skip gesture only)"
audio:
  - { on: "t=0 (fanfareStart)", cue_id: "fanfare stinger (incoming key, <tags> file; replaces the bed)", bus: Music }
  - { on: "rollEnd", cue_id: null, note: "the motif head / crash is INSIDE the fanfare; the visual IMPACT is timed to it, not the other way round" }
reduced_motion: reduce
reduced_motion_alternative: |
  No tremble, no camera punch. The Magician's RM crit (cut to crit.f7, held 500 ms) at rollEnd. Confetti: 6 slips fall
  straight 12 ap over 400 ms, no flutter; 3 coins. Curtain = a full-screen maroon cross-fade IN over 200 ms at
  rollEnd + 750; the same reset seam under it; the round card digits and the mood line cut in (no roll, no tag hops);
  cross-fade OUT over 200 ms ending at fanfareEnd (or on skip). O3b at +200.
